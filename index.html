<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>GoStock – bản demo</title>
  <style>
    :root { color-scheme: light dark; --bg: #f6f7f9; --fg: #1f2933; --muted: #616e7c; --card: #ffffff; --line: #e4e7eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14171c; --fg: #e4e7eb; --muted: #9aa5b1; --card: #1d2229; --line: #323a45; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 28px 24px; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 1.35rem; }
    p { margin: 0; }
    #updated { margin-top: 16px; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>GoStock – bản demo</h1>
    <p id="status">Đang chuyển tới bản demo…</p>
    <p id="updated" hidden></p>
  </main>
  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var updatedEl = document.getElementById('updated');
      var PAUSED = 'Bản demo đang tạm dừng, vui lòng thử lại sau ít phút hoặc liên hệ Dũng.';
      var VALID_URL = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;

      function showUpdated(value) {
        if (!value) return;
        var d = new Date(value);
        if (isNaN(d.getTime())) return;
        var text = d.toLocaleString('vi-VN', {
          timeZone: 'Asia/Ho_Chi_Minh', hour12: false,
          year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        updatedEl.textContent = 'Cập nhật lần cuối: ' + text + ' (giờ Việt Nam)';
        updatedEl.hidden = false;
      }

      fetch('link.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (data) {
          showUpdated(data && data.updated_at);
          var url = data && typeof data.url === 'string' ? data.url : '';
          if (url.indexOf('https://') === 0 && /\.trycloudflare\.com$/.test(url) && VALID_URL.test(url)) {
            location.replace(url);
          } else {
            statusEl.textContent = PAUSED;
          }
        })
        .catch(function () {
          statusEl.textContent = PAUSED;
        });
    })();
  </script>
</body>
</html>
